; Alembic configuration for LostIntoSpacE.
; Run from this directory:  cd database && alembic upgrade head
;
; The database URL is NOT stored here. It is read from the DATABASE_URL
; environment variable (via the app's Settings) in migrations/env.py, so no
; credentials are ever committed. See docs/backend/DATABASE_SETUP.md.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

; Timestamped, ordered revision filenames: 0001_..., 0002_..., etc. are assigned
; by hand (see migrations/versions/) so review order is obvious in a diff.
truncate_slug_length = 60

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
