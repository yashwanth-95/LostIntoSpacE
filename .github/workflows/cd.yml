name: CD

# Continuous delivery. Every push to an integration branch produces a
# versioned, downloadable build; a push to main additionally publishes the
# container images. Nothing here deploys to a live environment without an
# environment approval, because a rocket simulator that silently changes its
# physics under a user mid-flight is a bad experience.

on:
  push:
    branches: [main, 'integration/**', 'feat/**']
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options: [staging, production]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build release bundle
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: version
        name: Derive a version
        run: echo "version=$(date -u +%Y.%m.%d)-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # The web tsconfig compiles the simulation engine's sources directly, so
      # the engine's own dev dependencies must be installed first or every hook
      # in its adapters typechecks as `any`. Same reason as in ci.yml.
      - name: Install the simulation engine's dev dependencies
        working-directory: packages/simulation-engine
        run: npm ci

      - name: Build the web application
        working-directory: apps/web
        run: |
          npm ci
          npm run build

      - name: Bundle
        run: |
          mkdir -p release
          tar -czf "release/lostintospace-web-${{ steps.version.outputs.version }}.tar.gz" -C apps/web dist

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.version.outputs.version }}
          path: release/
          retention-days: 30

  images:
    name: Publish container images
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Container registries require a lowercase repository name, and
      # `github.repository` preserves the owner's capitalisation — for this
      # repo that is `yashwanth-95/LostIntoSpacE`, which ghcr rejects outright.
      - id: image
        name: Derive a lowercase image prefix
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/docker/api.Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.prefix }}/api:${{ needs.build.outputs.version }}
            ${{ steps.image.outputs.prefix }}/api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/docker/web.Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.prefix }}/web:${{ needs.build.outputs.version }}
            ${{ steps.image.outputs.prefix }}/web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy (${{ inputs.environment || 'staging' }})
    runs-on: ubuntu-latest
    needs: images
    if: github.event_name == 'workflow_dispatch'
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - name: Roll out
        run: bash deployment/scripts/deploy.sh "${{ inputs.environment }}" "${{ needs.build.outputs.version }}"
